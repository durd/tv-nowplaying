version: 2
updates:
  # The workflow pins actions to commit SHAs; this keeps those pins current.
  # No gradle entry: an AGP or Gradle bump needs gradle/verification-metadata.xml
  # regenerated on macOS and Linux (see AGENTS.md), which Dependabot can't do.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
