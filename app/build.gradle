plugins {
    id 'com.android.application'
}

// Settings live in the gitignored local.properties: the webhook id, optionally the Home Assistant URL.
def local = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { local.load(it) }

android {
    namespace 'io.github.durd.nowplaying'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.durd.nowplaying'
        // The TV is Android 11 (SDK 30).
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '0.1'
        buildConfigField 'String', 'WEBHOOK_ID', "\"${local.getProperty('nowplaying.webhookId', '')}\""
        // Empty: find Home Assistant over mDNS. Set it (http://host:port) only to skip discovery.
        buildConfigField 'String', 'HA_URL', "\"${local.getProperty('nowplaying.haUrl', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key, as the launcher does.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
