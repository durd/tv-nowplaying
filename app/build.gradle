import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// One version for the app and the Home Assistant integration that installs it: the integration's.
def version = new JsonSlurper().parse(rootProject.file('custom_components/tv_nowplaying/manifest.json')).version
def (major, minor, patch) = version.tokenize('.').collect { it as int }

// Release signing: the RELEASE_* environment (CI), else release.signing in the gitignored
// local.properties, naming a properties file with release.storeFile, storePassword, keyAlias and
// keyPassword. Without either, the debug key: fine for a local build, but the TV then refuses to
// update it with a release build (or the other way round) until the app is uninstalled.
def local = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { local.load(it) }
def signing = new Properties()
if (System.getenv('RELEASE_KEYSTORE')) {
    signing['release.storeFile'] = System.getenv('RELEASE_KEYSTORE')
    signing['release.storePassword'] = System.getenv('RELEASE_KEYSTORE_PASSWORD')
    signing['release.keyAlias'] = System.getenv('RELEASE_KEY_ALIAS')
    signing['release.keyPassword'] = System.getenv('RELEASE_KEY_PASSWORD')
} else if (local['release.signing']) {
    file(local['release.signing']).withInputStream { signing.load(it) }
}

android {
    namespace 'io.github.durd.nowplaying'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.durd.nowplaying'
        // The TV is Android 11 (SDK 30).
        minSdk 30
        targetSdk 34
        versionCode major * 10000 + minor * 100 + patch
        versionName version
    }

    signingConfigs {
        if (signing['release.storeFile']) {
            release {
                storeFile file(signing['release.storeFile'])
                storePassword signing['release.storePassword']
                keyAlias signing['release.keyAlias']
                keyPassword signing['release.keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signing['release.storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
